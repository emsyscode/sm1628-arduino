name: Compile and check panel examples
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: arduino-cli core update-index
      - run: arduino-cli core install arduino:avr@1.8.6
      - name: Compile untouched reference, legacy comparison and numeric-only demo
        run: |
          arduino-cli compile --fqbn arduino:avr:uno --warnings all --build-path build/reference reference/WorkingPanel/SM1628B_Panel_DVD_Reader_7digits_sanake_v0
          arduino-cli compile --fqbn arduino:avr:uno --warnings all --build-path build/refactor tests/fixtures/LegacyPanelDemo
          arduino-cli compile --fqbn arduino:avr:uno --warnings all --build-path build/numeric firmware/PanelDemo
      - name: Compile manual mapping diagnostic
        run: arduino-cli compile --fqbn arduino:avr:uno --warnings all --build-path build/manual firmware/ManualMap
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test

      - run: node tests/manual-map.cjs build/manual/ManualMap.ino.hex
      - name: Compile Snake and its engine checks
        run: |
          cp firmware/PanelSnake/SnakeGame.h tests/GameChecks/SnakeGame.h
          arduino-cli compile --fqbn arduino:avr:uno --warnings all --build-path build/snake firmware/PanelSnake
          arduino-cli compile --fqbn arduino:avr:uno --warnings all --build-path build/game-checks tests/GameChecks
          arduino-cli compile --fqbn arduino:avr:uno --warnings all --build-path build/joystick firmware/JoystickTest
      - run: node tests/panel-snake.cjs build/snake/PanelSnake.ino.hex build/game-checks/GameChecks.ino.hex
      - run: node tests/numeric-demo.cjs build/numeric/PanelDemo.ino.hex

      - name: Compile filming showcase
        run: arduino-cli compile --fqbn arduino:avr:uno --warnings all --build-path build/showcase firmware/PanelShowcase
      - run: node tests/panel-showcase.cjs build/showcase/PanelShowcase.ino.hex

      - run: node tests/snake-replay.cjs build/showcase/PanelShowcase.ino.hex

