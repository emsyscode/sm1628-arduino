name: Compare against working panel sketch
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: arduino-cli core update-index
      - run: arduino-cli core install arduino:avr@1.8.6
      - name: Compile untouched reference and clean candidate
        run: |
          arduino-cli compile --fqbn arduino:avr:uno --warnings all --build-path build/reference reference/WorkingPanel/SM1628B_Panel_DVD_Reader_7digits_sanake_v0
          arduino-cli compile --fqbn arduino:avr:uno --warnings all --build-path build/refactor firmware/PanelDemo
      - name: Compile one-pass mapping diagnostic
        run: arduino-cli compile --fqbn arduino:avr:uno --warnings all --build-path build/slot-map firmware/SlotMap
      - name: Compile manual mapping diagnostic
        run: arduino-cli compile --fqbn arduino:avr:uno --warnings all --build-path build/manual firmware/ManualMap
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test

      - run: node tests/manual-map.cjs build/manual/ManualMap.ino.hex

